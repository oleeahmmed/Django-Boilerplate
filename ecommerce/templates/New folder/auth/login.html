{% extends 'base.html' %}

{% block title %}Login - Chaldal{% endblock %}

{% block content %}
<div class="container mx-auto px-4 py-8 max-w-md">
  <div class="bg-white rounded-lg shadow-md p-6">
    <h2 class="text-2xl font-bold mb-6 text-center">Login to Your Account</h2>
    
    {% if messages %}
      {% for message in messages %}
        <div class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded mb-4">
          {{ message }}
        </div>
      {% endfor %}
    {% endif %}
    
    <form method="post">
      {% csrf_token %}
      <div class="mb-4">
        <label for="username" class="block text-gray-700 text-sm font-bold mb-2">Username or Email</label>
        <input type="text" name="username" id="username" required
               class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:border-red-500">
      </div>
      
      <div class="mb-6">
        <label for="password" class="block text-gray-700 text-sm font-bold mb-2">Password</label>
        <input type="password" name="password" id="password" required
               class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:border-red-500">
      </div>
      
      <button type="submit" class="w-full bg-red-500 text-white py-2 rounded-lg hover:bg-red-600 font-semibold">
        Login
      </button>
    </form>
    
    <div class="text-center mt-4">
      <p class="text-gray-600">Don't have an account? 
        <a href="{% url 'register' %}" class="text-red-500 hover:text-red-600">Register here</a>
      </p>
    </div>
  </div>
</div>
{% endblock %}
